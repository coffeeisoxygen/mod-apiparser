# Advanced Log Configuration for mod-apiparser
# Modular configuration with separated terminal and file handlers
# This structure allows for granular control and future extensibility

[mlog]
# Global logging settings
level = "INFO"
intercept = true  # Intercept standard library logging (uvicorn, etc.)
exception_hooks = true  # Enable global exception hooks

[mlog.terminal]
# Terminal/console output configuration
enabled = true
level = "INFO"  # Can be different from global level
format = "simple"  # Options: simple, full, minimal, custom
colorize = true  # Enable colors in terminal
diagnose = false  # Enable detailed diagnosis for terminal
enqueue = true  # Async logging for better performance

[mlog.file]
# File logging configuration
enabled = true
base_path = "logs"  # Base directory for all log files
name_prefix = "app"  # Prefix for log filenames
rotation_mb = 10  # Rotate when file reaches this size in MB
retention_days = 7  # Keep log files for this many days
enqueue = true  # Async file writing
diagnose = false  # Detailed diagnosis in files (can be large)

# Multiple file handlers based on log levels
[mlog.file.levels]
# Enable/disable specific level-based log files
info = true     # Create app_info.log for INFO+ messages
error = true    # Create app_error.log for ERROR+ messages
debug = false   # Skip app_debug.log (set to true for debug files)
warning = false # Skip app_warning.log (set to true for warning-only files)

[mlog.formatters]
# Custom format templates for different outputs
simple = "<level>{level.name}</level>: <magenta>{name}:{function}:{line}</magenta> | {message} | {extra}"
full = "<level>{level.name}</level>: {time:YYYY-MM-DD HH:mm:ss} | <cyan>{process.name}:{thread.name}</cyan> | <magenta>{name}:{function}:{line}</magenta> | <level>{message}</level> | {extra}"
minimal = "{level.name}: {message}"
json = '{"timestamp": "{time:YYYY-MM-DD HH:mm:ss}", "level": "{level.name}", "message": "{message}", "module": "{name}", "function": "{function}", "line": {line}, "extra": "{extra}"}'

[mlog.filters]
# Content filtering and redaction
sensitive_keywords = ["password", "token", "secret", "apikey", "authorization", "jwt"]
redact_replacement = "[REDACTED]"

# Module-based filtering (future extensibility)
# exclude_modules = ["urllib3.connectionpool", "requests.packages"]
# include_only = ["src", "app"]

[mlog.bind_context]
# Default context attached to all log messages
service = "mod-apiparser"
version = "1.0.0"
environment = "development"

